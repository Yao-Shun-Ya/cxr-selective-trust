# Model configuration: LOCKED v1.0 (Phase 0 / 2026)
# Decision record: docs/14_resource_locks.md
# Record exact model version, API snapshot, or checkpoint hash before every run.

project: medical-vlm-selective-trust
model_lock_version: models_v1
lock_status: locked_v1

selection_criteria:
  - accepts image + structured prompt
  - supports fixed JSON output
  - stable version or API snapshot
  - clinically relevant CXR capability
  - feasible cost
  - local or approved API access

primary_models:
  chexagent_8b:
    role: medical_cxr_specialist
    category: medical_specialist
    model_id: StanfordAIMI/CheXagent-8b
    source: huggingface
    model_url: https://huggingface.co/StanfordAIMI/CheXagent-8b
    repo_url: https://github.com/Stanford-AIMI/CheXagent
    access: local_open_weight
    output_mode: text_to_json_parse
    self_consistency_supported: true
    logprobs_supported: to_verify
    license: to_verify
    risk: "May output free text rather than strict JSON; must pilot parser."
    fallback: medgemma_27b_it

  gpt_4o_2024_11_20:
    role: strong_general_api
    category: general_api
    model_id: gpt-4o-2024-11-20
    source: openai_api
    access: api
    output_mode: json_mode_or_text_to_json_parse
    self_consistency_supported: true
    logprobs_supported: to_verify
    license: api_terms
    risk: "API snapshot availability, cost, and data-use compliance."
    fallback: "current strongest approved general API model, recorded as a separate sensitivity model"

  qwen25_vl_7b_instruct:
    role: open_weight_general
    category: open_weight_general
    model_id: Qwen/Qwen2.5-VL-7B-Instruct
    source: huggingface
    model_url: https://huggingface.co/Qwen/Qwen2.5-VL-7B-Instruct
    access: local_open_weight
    output_mode: text_to_json_parse
    self_consistency_supported: true
    logprobs_supported: true
    license: to_verify_by_size
    risk: "7B capacity may be lower than GPT-4o; validate before full benchmark."
    fallback: qwen25_vl_72b_instruct

secondary_models:
  medgemma_1_5:
    role: medical_generalist_backup
    category: medical_specialist_backup
    model_id: "MedGemma 1.5 27B variant (verify exact HF model ID)"
    model_card: https://developers.google.com/health-ai-developer-foundations/medgemma/model-card-v1
    technical_report: https://arxiv.org/abs/2604.05081
    access: local_open_weight
    use: "Replace CheXagent if parse failure > 20% or CXR performance too weak; prefer MedGemma 1.5 over original MedGemma."
  qwen25_vl_72b_instruct:
    role: high_capacity_open_weight_sensitivity
    model_id: Qwen/Qwen2.5-VL-72B-Instruct
    access: local_or_hosted
    use: "Full-stage sensitivity if compute budget allows."
  internvl25_8b:
    role: open_weight_backup
    model_id: OpenGVLab/InternVL2_5-8B
    use: "Backup if Qwen2.5-VL is unavailable or unstable."

generation:
  temperature: 0.0
  max_tokens: 512
  self_consistency_k: 5
  prompt_version: prompt_v1.0.0
  retry: 2

cache:
  enabled: true
  key_fields:
    - model_version
    - image_hash
    - prompt_hash
    - preprocess_version
    - shift_params

compliance:
  upload_mimic_to_external_api: false
  record_api_snapshot: true
  record_checkpoint_hash: true

fallback_api_models:
  deepseek_vision_api:
    role: exploratory_or_fallback_general_api
    status: candidate_to_verify
    official_vision_docs: https://api-docs.deepseek.com/zh-cn/guides/vision/
    pricing_docs: https://api-docs.deepseek.com/quick_start/pricing/
    web_upload_limit_note: "Reported ~50 files per upload; for manual smoke test only."
    use: "Use official Vision API for reproducible experiments. Do not use web UI for main benchmark."
    compliance: "Never upload MIMIC, PHI, DICOM headers, or report text."
