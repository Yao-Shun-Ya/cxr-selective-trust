# ============================================================
# Model weight lock file
# ============================================================
# Weights are NOT versioned in this repository. Three reasons:
#
#   1. Physical limits. The nine local model directories total
#      ~142 GB. Git rejects single files >100 MB; Git LFS caps
#      single files at 2 GB and the free plan at 10 GiB of
#      storage and 10 GiB of monthly bandwidth.
#   2. Licence limits. MedGemma is gated under the Gemma Terms
#      of Use plus the Healthcare and Life Sciences Use Case
#      Extension (HAI-DEF); mirroring weights is prohibited.
#      LLaVA-Med weights are research-use-only and not
#      redistributable. CheXagent publishes no licence metadata.
#   3. Journal expectations. Nature-family and ML venue code
#      availability policies ask for a reproducible acquisition
#      path, not for redistributed weights.
#
# Therefore each model is pinned by Hugging Face repo id +
# commit revision. Pinning by revision means this file stays
# correct even after upstream pushes new commits.
#
# Revisions were read from the local download cache
# (models/<dir>/.cache/huggingface/trees/<rev>.json) and
# cross-checked against the Hugging Face API on 2026-10-08.
#
# Fetch with:  python scripts/fetch_models.py --all
# ============================================================

lock_version: 1
pinned_on: "2026-10-08"
default_dest_root: program/models

fetch_notes:
  - Gated repositories require `huggingface-cli login` after you
    have accepted the upstream terms on the model page. This
    repository cannot and does not accept them on your behalf.
  - Mainland-China network path: set HF_ENDPOINT=https://hf-mirror.com
    (see docs/45_weight_download_through_cn_mirrors.md).

models:

