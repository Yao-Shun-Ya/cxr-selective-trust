# ------------------------------------------------------------
# Derived directories that exist on disk but have NO upstream repo.
# They are reproducible from the models above and must not be
# confused with downloaded artifacts.
# ------------------------------------------------------------
derived:

  chexagent_8b_fp16:
    local_dir: program/models/CheXagent-8b-fp16
    on_disk_gb: 15.6
    produced_by: program/scripts/62_convert_chexagent_fp16.py
    source: chexagent_8b
    note: >
      Local de-quantised fp16 snapshot. Does not exist on Hugging Face.
      Reported separately in the hardware profiling notes because the
      4-bit and fp16 paths have different memory profiles.

  qwen3_vl_30b_a3b_awq4bit:
    local_dir: program/models/Qwen3-VL-30B-A3B-Instruct-AWQ4bit
    on_disk_gb: 17.9
    source: Qwen/Qwen3-VL-30B-A3B-Instruct
    note: >
      Locally quantised copy. Its config.json declares
      quant_method compressed-tensors, format pack-quantized,
      4-bit group strategy, group_size 32 — despite the directory
      name saying AWQ. There is no published HF repo with this
      exact name, so the name is historical and slightly misleading.
      Rebuild with llm-compressor if this configuration is needed.

