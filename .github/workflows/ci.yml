name: cpu-ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scikit-learn pillow pyyaml
      - name: Legacy parser tests
        run: python -m pytest -q tests
      - name: Authoritative cxr_trust tests
        working-directory: program
        run: python -m pytest -q tests
      - name: Manifest contract
        run: |
          python - <<'PY'
          import csv, hashlib, json, pathlib
          man = pathlib.Path("program/data/manifests")
          rows = sum(1 for _ in csv.DictReader(open(man / "nih_eval_1506.csv", encoding="utf-8-sig")))
          assert rows == 1506, rows
          lock = json.loads((man / "MANIFEST_SHA256.json").read_text(encoding="utf-8"))
          for name, meta in lock.items():
              p = man / name
              assert p.stat().st_size == meta["bytes"], name
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              assert h == meta["sha256"], name
          print("manifest contract OK")
          PY

  audit-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the audit CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "audit[dev]" pyyaml
          python -m pip check
      - name: Audit CLI tests
        run: python -m pytest -q audit/tests
      - name: Synthetic demo (no data, no network)
        run: python -m cxr_audit demo > /dev/null
      - name: Citation and metadata records
        run: |
          python - <<'PY'
          import json, pathlib, yaml
          root = pathlib.Path(".")
          cff = yaml.safe_load((root / "CITATION.cff").read_text(encoding="utf-8"))
          assert cff["cff-version"] == "1.2.0", cff["cff-version"]
          assert cff["type"] == "software"
          assert cff["preferred-citation"]["title"].startswith("Responsiveness Before Reliance")
          zen = json.loads((root / ".zenodo.json").read_text(encoding="utf-8"))
          assert zen["upload_type"] == "software"
          assert zen["license"] == "MIT"
          assert zen["creators"][0]["orcid"] == "0009-0006-1226-8145"
          json.loads((root / "program/data/manifests/MANIFEST_SHA256.json").read_text(encoding="utf-8"))
          print("citation metadata OK")
          PY

  resume:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Create the stub venv
        run: |
          python -m venv program/.venv-vl
          program/.venv-vl/Scripts/python.exe -m pip install --upgrade pip
          program/.venv-vl/Scripts/python.exe -m pip install pytest numpy pandas scikit-learn pillow pyyaml tqdm
      - name: Authoritative tests
        working-directory: program
        run: .venv-vl/Scripts/python.exe -m pytest -q tests
      - name: Crash/resume with stubbed model (no GPU)
        working-directory: program
        run: .venv-vl/Scripts/python.exe scripts/41_test_runner_resume.py
