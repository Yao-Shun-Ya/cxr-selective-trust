[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-trust-audit"
version = "0.1.0"
description = "CPU-only reproducibility audit for medical vision-language model prediction files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Koshun Huang" }]
keywords = [
  "medical vision-language models",
  "reproducibility",
  "benchmark audit",
  "selective prediction",
  "chest X-ray",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]

[project.scripts]
cxr-audit = "cxr_audit.cli:main"

[project.urls]
Homepage = "https://github.com/Yao-Shun-Ya/cxr-selective-trust"
Repository = "https://github.com/Yao-Shun-Ya/cxr-selective-trust"
Issues = "https://github.com/Yao-Shun-Ya/cxr-selective-trust/issues"
Changelog = "https://github.com/Yao-Shun-Ya/cxr-selective-trust/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["cxr_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
